# ALTERNATIVE (not the default): synthesizer v0.3 on CLEAN residuals (tone subtracted), tuned per class with Optuna.
# Its tune/test fair AUC is worse than configs/synth.yaml (results/experiments.md, M1g): clean residuals expose
# tone detail (broad skirts, steady upper harmonics) the synthesizer does not yet produce. Kept for tone-model work.
# Physics-informed mosquito flight-tone synthesizer (v0.3).
# Tone parameters, noise and device chain all come from REAL calibration clips
# (`python -m src.synth.calibrate`). Literature priors are only for sanity checks and for classes/sexes
# with no real data (males), whose clips are tagged `source=prior`.

seed: 1234
sample_rate: 8000
calibration_file: data/synthetic/calibration_v03.json
noise_bank_dir: data/synthetic/noise_bank_v03 # per-clip residuals (tone subtracted, bands refilled)
out_dir: data/synthetic/clips_v03_clean

# Literature priors: fundamental wingbeat frequency mean / sd in Hz.
priors:
  ae_aegypti:          {female: [511, 46], male: [711, 78], ref: "Arthur et al. 2014, PMC3985972 (~23 C)"}
  ae_albopictus:       {female: [499, 18], male: [704, 50], ref: "PMC12049413 (27 C, swarming-age adults)"}
  cx_quinquefasciatus: {female: [415, 18], male: [534, 34], ref: "PMC12049413 (27 C, swarming-age adults)"}
male_female_ratio: [1.29, 1.41]   # used to derive male clips when a class has no real male recordings

source:
  f0_scale_jitter: 0.0            # extra per-clip f0 scaling; 0 for realism, >0 for training diversity
  harmonic_profile_jitter_db: 0.0 # jitter on the copied harmonic profile
  use_measured_phase: true        # fixed measured harmonic phases (real waveform shape)
  max_harmonic_hz: 3990
  harmonic_levels: energy         # energy (tone energy per harmonic band) | peak (spectral peak level)

# Defaults for the knobs tuned against the realism check; per-class values live under `species`
# (src/synth/tune.py). Drift and AM are scaled versions of the per-clip measured values.
tuning:
  drift_from: sharpness           # sharpness (match each clip's measured f0-peak sharpness) | track_cv (fine pitch track)
  drift_scale: 0.85
  drift_tau_s: 0.02
  am_scale: 0.7
  am_tau_s: 0.06
  harmonic_jitter_db: 2.0
  fast_fm_scale: 1.0              # x measured fast (> 20 Hz) pitch wobble: broad skirts around harmonics
  fast_am_scale: 1.0              # x measured fast level wobble
  fast_bw_hz: 80.0                # bandwidth of the fast wobble
  harmonic_tilt_db: 0.0           # dB added per harmonic above the 1st (negative = darker)
  snr_jitter_db: 0.0              # jitter on the mixing target (tnr or snr), dB
  tnr_offset_db: 0.0              # constant offset on the mixing target, dB
  level_jitter_db: 0.0

flight:
  start_distance_m: [0.05, 0.3]
  speed_m_s: [0.2, 0.8]
  turn_rate: 2.0                  # heading-change strength of the wander
  flyby_prob: 0.0                 # share of clips that are near-straight passes (approach / pass / leave)
  flyby_miss_m: 0.1               # max closest-approach distance of a pass
  spreading_exponent: [1.0, 1.3]  # pressure ~ 1/r^n
  min_distance_m: 0.02
  speed_of_sound_m_s: 343.0       # Doppler (from the time-varying path delay)

# Early reflections of a box (cage or room) around the mic, image-source method.
room:
  enabled: false
  dims_m: [0.3, 1.0]              # each side drawn from this range
  reflection_coef: [0.3, 0.8]     # per wall
  order: 1                        # 1 = 6 first-order images, 2 = 24 images

# Measured correction filter (src/synth/fit_eq.py, tune split): median real / median synthetic spectrum.
# Fitted (data/synthetic/eq_v03.json, tone; eq_v03_mix.json, mix) but OFF: both made the tune AUC worse (M1g).
eq:
  enabled: false
  file: data/synthetic/eq_v03.json
  apply_to: tone                  # tone (the synthetic part only; the noise is real) | mix
  max_db: 6.0
  smooth_hz: 150

# Per-class overrides of any block above (written by src/synth/tune.py).
species:
  ae_aegypti:
    tuning: {drift_from: track_cv, drift_scale: 0.714, drift_tau_s: 0.055, am_scale: 0.1, am_tau_s: 0.013, harmonic_jitter_db: 3.499,
      fast_fm_scale: 0.617, fast_am_scale: 0.887, fast_bw_hz: 23.98, harmonic_tilt_db: -0.135, snr_jitter_db: 4.86, tnr_offset_db: -0.973}
    flight:
      start_distance_m: [0.03, 0.205]
      speed_m_s: [0.1, 0.739]
      turn_rate: 1.189
      flyby_prob: 0.049
      flyby_miss_m: 0.073
    room: {enabled: false}
    source: {harmonic_levels: energy}
  cx_quinquefasciatus:
    tuning: {drift_from: track_cv, drift_scale: 0.792, drift_tau_s: 0.068, am_scale: 0.184, am_tau_s: 0.013, harmonic_jitter_db: 3.705,
      fast_fm_scale: 1.396, fast_am_scale: 0.963, fast_bw_hz: 32.396, harmonic_tilt_db: -0.128, snr_jitter_db: 4.798, tnr_offset_db: 3.002}
    flight:
      start_distance_m: [0.03, 0.151]
      speed_m_s: [0.1, 0.962]
      turn_rate: 2.304
      flyby_prob: 0.216
      flyby_miss_m: 0.06
    room: {enabled: false}
    source: {harmonic_levels: energy}

noise:
  pairing: same_sr                # same_clip | same_sr (random residual, same dataset + original sample rate)
  pool_by: [dataset, orig_sr, cls] # residual pool for same_sr pairing (Funchal: one batch per species)
  mix: tnr                        # tnr: tone-to-noise energy ratio of the source clip | snr: peak-SNR search
  snr_tol_db: 0.5
  refill: borrow                  # calibration: refill subtracted bands with borrow (same-frame noise) | random

# Training-time device randomisation. OFF for realism tests: real residuals already carry the
# real mic colouring, so random EQ on top only adds a giveaway.
augment_channel:
  enabled: false
  highpass_hz: [20, 120]
  lowpass_hz: [3400, 3990]
  n_peaking_eq: [0, 3]
  peaking_gain_db: [-8, 8]
  self_noise_db: [-60, -35]       # re. clip peak
  clip_probability: 0.05
