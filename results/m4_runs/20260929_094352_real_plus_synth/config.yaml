name: m4_real_plus_synth
seed: 1
features_dir: data/processed/features
out_dir: results/m4_runs/20260929_094352_real_plus_synth
tasks:
- presence
- species
use_synthetic: false
model:
  channels:
  - 16
  - 32
  - 64
  - 96
  dropout: 0.3
train:
  batch_size: 256
  epochs: 30
  learning_rate: 0.001
  early_stopping_patience: 5
  class_weight: balanced
augment:
  gain_db: 10
  freq_mask: 8
  time_mask: 10
  mask_prob: 0.5
evaluate:
  splits:
  - val
  - test
  - test_A
  - test_B
  - external
  threshold_from: val_f1
  smoothing:
  - 2
  - 3
train_data: real+synth
